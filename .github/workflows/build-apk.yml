name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - '*.css'
      - '*.js'
      - '*.txt'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy H5 game into Android assets
        shell: bash
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          find . -maxdepth 1 -type f \( -name '*.css' -o -name '*.js' -o -name '*.txt' \) -exec cp {} android/app/src/main/assets/ \;

          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('android/app/src/main/assets')
          parts = {}
          for name in ['v5.part1.txt','v5.part2.txt','v5.part3.txt']:
              parts[name] = (base / name).read_text(encoding='utf-8')
          js = '''(function(){\nconst parts=%s;\nconst originalFetch=window.fetch ? window.fetch.bind(window) : null;\nwindow.fetch=function(input,init){\n  const key=typeof input==='string' ? input.split('?')[0].replace(/^\.\//,'') : '';\n  if(Object.prototype.hasOwnProperty.call(parts,key)){\n    return Promise.resolve(new Response(parts[key],{status:200,headers:{'Content-Type':'text/plain; charset=utf-8'}}));\n  }\n  return originalFetch ? originalFetch(input,init) : Promise.reject(new Error('fetch unavailable'));\n};\n})();\n''' % json.dumps(parts, ensure_ascii=False)
          (base / 'android-preload.js').write_text(js, encoding='utf-8')
          p = base / 'index.html'
          html = p.read_text(encoding='utf-8')
          html = html.replace('<script src="v5.js?v=522"></script>', '<script src="android-preload.js"></script>\n  <script src="v5.js?v=522"></script>')
          p.write_text(html, encoding='utf-8')
          PY

          echo 'Bundled assets:'
          ls -lh android/app/src/main/assets
          grep -n 'android-preload' android/app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - name: Build release APK
        run: gradle -p android assembleRelease --stacktrace

      - name: Rename APKs
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/from-10k-to-1m-v1.0.1-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/from-10k-to-1m-v1.0.1-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: from-10k-to-1m-v1.0.1-debug-apk
          path: dist/from-10k-to-1m-v1.0.1-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: from-10k-to-1m-v1.0.1-release-unsigned-apk
          path: dist/from-10k-to-1m-v1.0.1-release-unsigned.apk
